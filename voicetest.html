<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STATS — voice test</title>
<style>
:root{--page:#0a0e17;--card:#161d2e;--card2:#111a2b;--line:#26304a;--ink:#eef2fb;
 --body:#d6ddee;--muted:#93a0bd;--dim:#6f7d9c;--teal:#28e0d0;--blue:#2f6bff;
 --gold:#ffc54d;--green:#2ee6a6;--red:#ff4d5e;
 --f:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;
 --m:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--body);font-family:var(--f);font-size:15px;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{color:var(--ink);font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.4px}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.k{font-family:var(--m);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
button{width:100%;border:0;border-radius:14px;padding:20px;font-family:var(--f);
 font-size:20px;font-weight:800;cursor:pointer;margin-top:12px;color:#fff;background:var(--blue)}
button.stop{background:var(--red)}
button:disabled{opacity:.4}
.big{font-size:30px;font-weight:800;color:var(--teal);min-height:40px;
 font-family:var(--m);word-break:break-word;line-height:1.2}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--dim);font-family:var(--m);font-size:12px;
 text-transform:uppercase;letter-spacing:.6px;width:44%}
td b{color:var(--ink);font-weight:600}
.yes{color:var(--green)}.no{color:var(--red)}
#log{font-family:var(--m);font-size:12px;color:var(--muted);max-height:300px;
 overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:12px;
 padding:12px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
#log b{color:var(--ink)} #log .e{color:var(--red)} #log .g{color:var(--green)} #log .y{color:var(--gold)}
</style></head><body><div class="w">

<h1>Voice test</h1>
<p class="sub">This page is not the game. It talks to your phone's speech engine directly, with no
STATS code in the way — so whatever happens here is the truth about the device, not about the app.</p>

<div class="card">
  <div class="k">Your device</div>
  <table id="env"></table>
</div>

<button id="go">🎙 Tap and say “two”</button>
<button id="stop" class="stop" style="display:none">■ Stop</button>

<div class="card">
  <div class="k">What it heard</div>
  <div class="big" id="heard">—</div>
  <p class="sub" id="conf"></p>
</div>

<div class="card">
  <div class="k">Every event, in order</div>
  <div id="log">waiting for a tap…</div>
  <button id="copy" style="background:var(--card2);color:var(--body);font-size:15px;padding:14px">Copy this log</button>
</div>

<script>
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var ua = navigator.userAgent||'';
var isIOS = /iP(hone|od|ad)/.test(navigator.platform||'') || /iPhone|iPad|iPod/.test(ua)
         || (/Mac/.test(navigator.platform||'') && navigator.maxTouchPoints>1);
var iosBrowser = /CriOS/.test(ua)?'Chrome on iOS':/FxiOS/.test(ua)?'Firefox on iOS'
               : /EdgiOS/.test(ua)?'Edge on iOS':/OPiOS/.test(ua)?'Opera on iOS':'Safari';
var rows=[
 ['Browser', isIOS ? iosBrowser : (/Chrome/.test(ua)?'Chrome':/Firefox/.test(ua)?'Firefox':/Safari/.test(ua)?'Safari':'other')],
 ['Platform', isIOS ? 'iOS / iPadOS' : (/Android/.test(ua)?'Android':'desktop')],
 ['Secure context', window.isSecureContext ? '<b class="yes">yes</b>' : '<b class="no">NO — speech needs https</b>'],
 ['SpeechRecognition', SR ? '<b class="yes">present</b>' : '<b class="no">MISSING</b>'],
 ['&nbsp;&nbsp;prefixed?', window.SpeechRecognition ? 'standard' : (window.webkitSpeechRecognition?'webkit only':'—')],
 ['getUserMedia', (navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?'<b class="yes">present</b>':'<b class="no">MISSING</b>'],
 ['MediaRecorder', window.MediaRecorder ? '<b class="yes">present</b>' : '<b class="no">MISSING</b>'],
 ['speechSynthesis', window.speechSynthesis ? '<b class="yes">present</b>' : '<b class="no">MISSING</b>']
];
document.getElementById('env').innerHTML =
  rows.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'; }).join('');

var L=document.getElementById('log'); L.textContent='';
var t0=Date.now();
function log(msg,cls){
  var t=((Date.now()-t0)/1000).toFixed(1)+'s ';
  var d=document.createElement('div');
  d.innerHTML='<b>'+t+'</b><span class="'+(cls||'')+'">'+String(msg).replace(/</g,'&lt;')+'</span>';
  L.appendChild(d); L.scrollTop=L.scrollHeight;
}
log('page ready · '+ua.slice(0,90));
if(isIOS && iosBrowser!=='Safari') log('THIS BROWSER HAS NO MICROPHONE ACCESS ON iOS. Open in Safari.','e');
if(!SR) log('no SpeechRecognition on this browser at all','e');

var rec=null, running=false;
var go=document.getElementById('go'), stop=document.getElementById('stop');

go.onclick=function(){
  if(!SR){ log('cannot start: no SpeechRecognition','e'); return; }
  t0=Date.now();
  log('--- tap: creating recogniser ---','y');
  try{
    rec = new SR();
    rec.lang='en-US'; rec.maxAlternatives=5;
    rec.continuous = !isIOS;
    rec.interimResults = true;
    log('continuous='+rec.continuous+' interimResults='+rec.interimResults);
    rec.onstart      = function(){ log('onstart — engine accepted the request','g'); };
    rec.onaudiostart = function(){ log('onaudiostart — MICROPHONE IS OPEN','g'); };
    rec.onsoundstart = function(){ log('onsoundstart — it can hear sound'); };
    rec.onspeechstart= function(){ log('onspeechstart — it thinks that is speech','g'); };
    rec.onspeechend  = function(){ log('onspeechend'); };
    rec.onsoundend   = function(){ log('onsoundend'); };
    rec.onaudioend   = function(){ log('onaudioend — microphone closed'); };
    rec.onnomatch    = function(){ log('onnomatch — heard something, understood nothing','y'); };
    rec.onerror = function(e){
      log('ONERROR: '+(e.error||'?')+(e.message?(' — '+e.message):''),'e');
      if(e.error==='not-allowed') log('The microphone was DENIED. Check Settings and reload.','e');
      if(e.error==='service-not-allowed') log('The OS refused the speech service.','e');
      if(e.error==='no-speech') log('It opened, waited, and heard no speech.','y');
    };
    rec.onresult = function(ev){
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var r=ev.results[i], best=r[0];
        var alts=[]; for(var j=0;j<r.length;j++) alts.push('"'+r[j].transcript.trim()+'"');
        log((r.isFinal?'FINAL   ':'interim ')+alts.join(' | '), r.isFinal?'g':'');
        document.getElementById('heard').textContent = best.transcript.trim() || '—';
        document.getElementById('conf').textContent =
          (r.isFinal?'final':'still listening') +
          (best.confidence?(' · confidence '+Math.round(best.confidence*100)+'%'):'') +
          ' · '+r.length+' alternative'+(r.length===1?'':'s');
      }
    };
    rec.onend = function(){
      running=false; go.style.display=''; stop.style.display='none';
      log('onend — session over'+(isIOS?' (iOS ends after one utterance; tap again)':''),'y');
    };
    rec.start();
    running=true; go.style.display='none'; stop.style.display='';
    log('start() returned without throwing');
  }catch(err){
    log('start() THREW: '+(err&&(err.name+': '+err.message)),'e');
    log('On iOS this is the gesture rule — but this WAS a tap, so it is something else.','e');
    go.style.display=''; stop.style.display='none';
  }
};
stop.onclick=function(){ try{ rec&&rec.stop(); }catch(e){} log('stop() called'); };

document.getElementById('copy').onclick=function(){
  var txt='STATS voice test\n'+ua+'\n'+rows.map(function(r){
    return r[0].replace(/&nbsp;/g,'')+': '+r[1].replace(/<[^>]+>/g,''); }).join('\n')+'\n\n'+L.innerText;
  try{ navigator.clipboard.writeText(txt); this.textContent='Copied — paste it to Claude'; }
  catch(e){ this.textContent='Select the log above and copy it'; }
};
</script></div></body></html>
